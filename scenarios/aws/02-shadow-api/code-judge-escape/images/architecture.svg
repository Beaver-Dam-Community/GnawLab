<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-faint" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Title -->
  <text x="800" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">code-judge-escape — Infrastructure Architecture</text>
  <text x="800" y="72" text-anchor="middle" font-size="14" fill="#64748b">VulnBoard (Flask) → docker.sock → IMDSv2 → ECS Fargate (flag-vault)</text>

  <!-- Attacker -->
  <g>
    <circle cx="90" cy="500" r="48" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="90" y="495" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">Attacker</text>
    <text x="90" y="514" text-anchor="middle" font-size="11" fill="#7f1d1d">target_info.txt</text>
    <text x="90" y="572" text-anchor="middle" font-size="11" fill="#64748b">(whitelisted IP)</text>
  </g>

  <!-- Internet / Boundary -->
  <line x1="155" y1="500" x2="240" y2="500" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="197" y="492" text-anchor="middle" font-size="11" fill="#64748b">HTTP 8080</text>

  <!-- AWS region label -->
  <text x="260" y="118" font-size="13" font-weight="600" fill="#f97316">AWS us-east-1</text>

  <!-- VPC outer box -->
  <rect x="260" y="130" width="1230" height="820" rx="14" fill="#fff7ed" stroke="#fb923c" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="278" y="160" font-size="14" font-weight="700" fill="#9a3412">VPC  10.42.0.0/16</text>

  <!-- IGW -->
  <g>
    <rect x="282" y="455" width="80" height="80" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="322" y="492" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">IGW</text>
    <text x="322" y="510" text-anchor="middle" font-size="10" fill="#0c4a6e">Internet</text>
    <text x="322" y="524" text-anchor="middle" font-size="10" fill="#0c4a6e">Gateway</text>
  </g>

  <!-- Public Subnet -->
  <rect x="400" y="200" width="700" height="320" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="416" y="228" font-size="13" font-weight="700" fill="#155e75">Public Subnet  10.42.0.0/24  (us-east-1a)</text>

  <!-- EC2 Instance (VulnBoard host) -->
  <rect x="430" y="250" width="640" height="250" rx="10" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <text x="448" y="278" font-size="13" font-weight="700" fill="#0e7490">EC2 :: gnawlab-codejudge-vulnboard-xxxxxxxx</text>
  <text x="448" y="296" font-size="11" fill="#475569">Amazon Linux 2023 · t3.small · IMDSv2 (hop_limit=1)</text>

  <!-- Docker daemon box -->
  <rect x="448" y="312" width="610" height="170" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="464" y="334" font-size="12" font-weight="700" fill="#15803d">Docker Engine 26.x  (host)</text>

  <!-- VulnBoard container -->
  <rect x="468" y="350" width="290" height="120" rx="6" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="613" y="374" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">VulnBoard container</text>
  <text x="613" y="393" text-anchor="middle" font-size="10.5" fill="#475569" font-family="ui-monospace, Menlo, monospace">Flask 3 + gunicorn :5000 → :8080</text>
  <text x="613" y="411" text-anchor="middle" font-size="10.5" fill="#475569" font-family="ui-monospace, Menlo, monospace">pickle.loads(result_cache) ← VULN</text>
  <text x="613" y="429" text-anchor="middle" font-size="10.5" fill="#475569" font-family="ui-monospace, Menlo, monospace">/var/run/docker.sock (mounted)</text>
  <text x="613" y="447" text-anchor="middle" font-size="10.5" fill="#475569" font-family="ui-monospace, Menlo, monospace">/srv/docker-compose.yml (hint, ro)</text>

  <!-- Ephemeral sandbox container -->
  <rect x="780" y="350" width="265" height="55" rx="6" fill="#fff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="912" y="372" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">grading sandbox (per-submission)</text>
  <text x="912" y="390" text-anchor="middle" font-size="10" fill="#64748b" font-family="ui-monospace, Menlo, monospace">python:3.11-slim — network=none</text>

  <!-- Attacker-spawned host-net container -->
  <rect x="780" y="415" width="265" height="55" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="912" y="437" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">attacker container (post-escape)</text>
  <text x="912" y="454" text-anchor="middle" font-size="10" fill="#7f1d1d" font-family="ui-monospace, Menlo, monospace">alpine — --network host → IMDS</text>

  <!-- IMDSv2 -->
  <g>
    <rect x="1110" y="290" width="170" height="78" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="1195" y="313" text-anchor="middle" font-size="12" font-weight="700" fill="#854d0e">IMDSv2</text>
    <text x="1195" y="332" text-anchor="middle" font-size="10.5" font-family="ui-monospace, Menlo, monospace" fill="#713f12">169.254.169.254</text>
    <text x="1195" y="350" text-anchor="middle" font-size="10.5" fill="#854d0e">hop_limit = 1</text>
    <text x="1195" y="364" text-anchor="middle" font-size="9.5" fill="#a16207">(bridge: blocked)</text>
  </g>

  <!-- NAT GW -->
  <g>
    <rect x="1130" y="430" width="130" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="1195" y="455" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">NAT GW</text>
    <text x="1195" y="475" text-anchor="middle" font-size="10" fill="#0c4a6e">egress for Fargate</text>
    <text x="1195" y="490" text-anchor="middle" font-size="10" fill="#0c4a6e">(SSM, ECR)</text>
  </g>

  <!-- Private subnets -->
  <rect x="400" y="560" width="700" height="370" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="416" y="588" font-size="13" font-weight="700" fill="#5b21b6">Private Subnets  10.42.10.0/24 (AZ a) / 10.42.11.0/24 (AZ b)</text>

  <!-- ECS Fargate cluster -->
  <rect x="430" y="612" width="640" height="295" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="448" y="638" font-size="13" font-weight="700" fill="#6d28d9">ECS Fargate :: gnawlab-codejudge-cluster-xxxxxxxx</text>
  <text x="448" y="656" font-size="11" fill="#475569">launch_type=FARGATE · enable_execute_command=true</text>

  <!-- flag-vault task -->
  <rect x="460" y="676" width="380" height="170" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="2"/>
  <text x="650" y="700" text-anchor="middle" font-size="12" font-weight="700" fill="#86198f">Fargate Task :: flag-vault</text>
  <text x="650" y="720" text-anchor="middle" font-size="10.5" fill="#475569" font-family="ui-monospace, Menlo, monospace">public.ecr.aws/docker/library/alpine:3.19</text>
  <text x="650" y="738" text-anchor="middle" font-size="10.5" fill="#475569" font-family="ui-monospace, Menlo, monospace">linuxParameters.initProcessEnabled = true</text>

  <rect x="490" y="752" width="320" height="80" rx="6" fill="#fff" stroke="#c026d3" stroke-width="2"/>
  <text x="650" y="776" text-anchor="middle" font-size="12" font-weight="700" fill="#86198f">/app/data/flag.txt</text>
  <text x="650" y="794" text-anchor="middle" font-size="10" fill="#64748b" font-family="ui-monospace, Menlo, monospace">FLAG{pickle_to_docker_sock_to_imds_to_ecs_exec}</text>
  <text x="650" y="812" text-anchor="middle" font-size="10" fill="#64748b">chmod 0444 · FLAG env unset after write</text>

  <!-- ExecuteCommand agent -->
  <rect x="860" y="700" width="195" height="65" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text x="957" y="722" text-anchor="middle" font-size="11" font-weight="700" fill="#9a3412">SSM Messages channel</text>
  <text x="957" y="738" text-anchor="middle" font-size="10" fill="#7c2d12">ExecuteCommandAgent</text>
  <text x="957" y="753" text-anchor="middle" font-size="10" fill="#7c2d12">(ECS Exec session)</text>

  <!-- Task role badge -->
  <rect x="860" y="775" width="195" height="55" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <text x="957" y="795" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">task-role-xxxxxxxx</text>
  <text x="957" y="811" text-anchor="middle" font-size="10" fill="#64748b">ssmmessages:* only</text>

  <!-- IAM roles column on right -->
  <text x="1310" y="195" font-size="13" font-weight="700" fill="#9a3412">IAM</text>

  <rect x="1310" y="210" width="160" height="105" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1390" y="232" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">app-role (EC2)</text>
  <text x="1390" y="252" text-anchor="middle" font-size="9.5" fill="#7f1d1d">ec2:Describe*</text>
  <text x="1390" y="266" text-anchor="middle" font-size="9.5" fill="#7f1d1d">ecs:List/Describe*</text>
  <text x="1390" y="280" text-anchor="middle" font-size="9.5" fill="#7f1d1d" font-weight="700">ecs:ExecuteCommand</text>
  <text x="1390" y="294" text-anchor="middle" font-size="9.5" fill="#7f1d1d">ssmmessages:*</text>
  <text x="1390" y="308" text-anchor="middle" font-size="9" fill="#a16207" font-style="italic">(legacy, not trimmed)</text>

  <rect x="1310" y="335" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1390" y="357" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">exec-role (Fargate)</text>
  <text x="1390" y="376" text-anchor="middle" font-size="9.5" fill="#475569">AmazonECSTask-</text>
  <text x="1390" y="390" text-anchor="middle" font-size="9.5" fill="#475569">ExecutionRolePolicy</text>

  <rect x="1310" y="425" width="160" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="1390" y="447" text-anchor="middle" font-size="11" font-weight="700" fill="#334155">task-role</text>
  <text x="1390" y="466" text-anchor="middle" font-size="9.5" fill="#475569">ssmmessages:*</text>
  <text x="1390" y="480" text-anchor="middle" font-size="9.5" fill="#475569">(minimal)</text>

  <!-- Security Groups -->
  <rect x="1310" y="540" width="160" height="100" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
  <text x="1390" y="562" text-anchor="middle" font-size="11" font-weight="700" fill="#0e7490">vulnboard-sg</text>
  <text x="1390" y="580" text-anchor="middle" font-size="9.5" fill="#155e75">ingress 8080 ←</text>
  <text x="1390" y="594" text-anchor="middle" font-size="9.5" fill="#155e75">whitelist_cidr</text>
  <text x="1390" y="614" text-anchor="middle" font-size="9.5" fill="#155e75">egress 0.0.0.0/0</text>

  <rect x="1310" y="660" width="160" height="80" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1390" y="682" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">fargate-sg</text>
  <text x="1390" y="700" text-anchor="middle" font-size="9.5" fill="#4c1d95">no public ingress</text>
  <text x="1390" y="716" text-anchor="middle" font-size="9.5" fill="#4c1d95">egress via NAT</text>

  <!-- ========================== Attack-flow arrows ========================== -->

  <!-- 1: attacker → VulnBoard -->
  <path d="M 155 500 C 270 500, 350 410, 468 410" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <circle cx="295" cy="430" r="11" fill="#dc2626"/>
  <text x="295" y="434" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>

  <!-- 2: pickle gadget inside VulnBoard -->
  <circle cx="613" cy="402" r="11" fill="#dc2626"/>
  <text x="613" y="406" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">2</text>

  <!-- 3: VulnBoard → spawn host-net container via docker.sock -->
  <path d="M 760 440 L 778 440" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <circle cx="769" cy="425" r="11" fill="#dc2626"/>
  <text x="769" y="429" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">3</text>

  <!-- 4: container → IMDSv2 -->
  <path d="M 1045 432 C 1095 380, 1130 350, 1130 330" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <circle cx="1100" cy="385" r="11" fill="#dc2626"/>
  <text x="1100" y="389" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">4</text>

  <!-- 5: credentials → AWS API → enumerate ECS (curved through right side) -->
  <path d="M 1280 318 C 1340 360, 1320 560, 1180 660" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrow)" stroke-dasharray="2 0"/>
  <circle cx="1340" cy="430" r="11" fill="#dc2626"/>
  <text x="1340" y="434" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">5</text>

  <!-- 6: ecs:ExecuteCommand → flag-vault -->
  <path d="M 1100 700 L 1055 720" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <circle cx="1085" cy="688" r="11" fill="#dc2626"/>
  <text x="1085" y="692" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">6</text>

  <!-- 7: read flag -->
  <path d="M 860 763 L 815 778" stroke="#dc2626" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <circle cx="847" cy="749" r="11" fill="#dc2626"/>
  <text x="847" y="753" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">7</text>

  <!-- Faint normal flow: NAT egress for Fargate -->
  <path d="M 650 676 C 800 600, 1100 540, 1195 500" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-faint)"/>

  <!-- Legend -->
  <rect x="40" y="800" width="200" height="160" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="56" y="824" font-size="12" font-weight="700" fill="#0f172a">Attack chain</text>
  <text x="56" y="846" font-size="11" fill="#334155">1 · POST /submit, read cookie</text>
  <text x="56" y="864" font-size="11" fill="#334155">2 · pickle.loads gadget = RCE</text>
  <text x="56" y="882" font-size="11" fill="#334155">3 · docker.sock → host container</text>
  <text x="56" y="900" font-size="11" fill="#334155">4 · IMDSv2 PUT+GET creds</text>
  <text x="56" y="918" font-size="11" fill="#334155">5 · sts + iam + ecs enum</text>
  <text x="56" y="936" font-size="11" fill="#334155">6 · ecs:ExecuteCommand</text>
  <text x="56" y="954" font-size="11" fill="#334155">7 · cat /app/data/flag.txt</text>
</svg>
